name: Desktop Linux builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build Linux x64 (.deb & .AppImage)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 xvfb dbus-x11 openbox xcompmgr x11-utils libgtk-3-0 libnss3 libasound2

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Package installers (.deb & .AppImage)
        run: npm run dist

      - name: Launch packaged app (Linux X11 smoke test)
        run: |
          dbus-run-session -- xvfb-run -a bash -c '
            openbox > /tmp/capri-openbox.log 2>&1 &
            xcompmgr > /tmp/capri-compositor.log 2>&1 &
            node scripts/smoke-test.js "dist/linux-unpacked/capri-desktop"
          '

      - name: X11 window watcher probe (Linux)
        run: |
          xvfb-run -a bash -c '
            openbox > /tmp/capri-openbox-probe.log 2>&1 &
            sleep 1
            xmessage -geometry 420x260+150+120 "Capri X11 probe" &
            sleep 1
            node scripts/x11-probe.js
          '

      - name: Check update metadata
        shell: bash
        run: ls dist/latest-linux*.yml || ls dist/latest*.yml

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capri-linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux*.yml
            dist/*.blockmap
            
  draft-release:
    name: Create or update draft release
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: capri-linux-x64*
          path: release-assets
      - name: Attach all platforms to draft
        run: node scripts/draft-release.js release-assets
        env:
          GH_TOKEN: ${{ github.token }}
